<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FINOVA — Iniciar sesión en la plataforma de costeo y optimización financiera.">
    <title>Iniciar Sesión | FINOVA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <!-- Logo -->
            <div class="login-logo">
                <img src="FINOVA-LOGO/Logotipo-Dark.png" alt="FINOVA">
                <p class="login-subtitle">Plataforma de Costeo y Optimización Financiera</p>
            </div>

            <!-- Error -->
            <div class="login-error" id="loginError">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                <span id="loginErrorText">Usuario o contraseña incorrectos</span>
            </div>

            <!-- Form -->
            <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
                <div class="login-field">
                    <label for="loginUser">Usuario</label>
                    <div class="input-wrapper">
                        <input type="text" id="loginUser" placeholder="Ingresa tu usuario" autocomplete="username" required>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </div>
                </div>

                <div class="login-field">
                    <label for="loginPass">Contraseña</label>
                    <div class="input-wrapper">
                        <input type="password" id="loginPass" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" title="Mostrar/ocultar contraseña">
                            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    Iniciar Sesión
                </button>
            </form>

            <!-- Footer -->
            <div class="login-footer">
                <p>Administración Financiera I · Licda. Glenda Monterroso</p>
                <p>Sistemas Informáticos · 7mo Semestre</p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/database.js"></script>
    <script src="js/audit.js"></script>
    <script src="js/auth.js"></script>
    <script>
    // Si ya hay sesión, ir al dashboard
    if (FiNovaAuth.isAuthenticated()) {
        window.location.href = 'dashboard.html';
    }

    async function handleLogin(e) {
        e.preventDefault();
        const username = document.getElementById('loginUser').value.trim();
        const password = document.getElementById('loginPass').value;
        const errorEl = document.getElementById('loginError');
        const errorText = document.getElementById('loginErrorText');
        const btn = document.getElementById('loginBtn');

        // Deshabilitar botón
        btn.disabled = true;
        btn.textContent = 'Verificando...';

        try {
            const result = await FiNovaAuth.login(username, password);

            if (result.success) {
                btn.textContent = '\u2713 Bienvenido';
                btn.style.background = 'linear-gradient(135deg, #22a06b 0%, #34d399 100%)';
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 500);
            } else {
                errorText.textContent = result.message;
                errorEl.classList.add('show');
                btn.disabled = false;
                btn.textContent = 'Iniciar Sesión';

                // Shake the card
                const card = document.querySelector('.login-card');
                card.style.animation = 'none';
                card.offsetHeight; // trigger reflow
                card.style.animation = 'errorShake 0.4s ease';

                // Ocultar error después de 4 segundos
                setTimeout(() => {
                    errorEl.classList.remove('show');
                }, 4000);
            }
        } catch (err) {
            errorText.textContent = 'Error de conexión con el servidor';
            errorEl.classList.add('show');
            btn.disabled = false;
            btn.textContent = 'Iniciar Sesión';
        }
    }

    function togglePasswordVisibility() {
        const passInput = document.getElementById('loginPass');
        const eyeIcon = document.getElementById('eyeIcon');
        if (passInput.type === 'password') {
            passInput.type = 'text';
            eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
        } else {
            passInput.type = 'password';
            eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        }
    }
    </script>
</body>
</html>
