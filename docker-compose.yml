services:
  # Servicio de SQL Server para la base de datos principal de FINOVA.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: finova-sqlserver
    environment:
      # Credenciales base y aceptación de licencia requeridas por la imagen oficial.
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: "Developer"
    ports:
      # Puerto expuesto para conexiones locales (SSMS, API y diagnóstico).
      - "${DB_PORT:-1433}:1433"
    volumes:
      # Persistencia para conservar la base de datos entre reinicios del contenedor.
      - sql_data:/var/opt/mssql
    healthcheck:
      # Verifica que SQL Server esté respondiendo consultas antes de habilitar dependencias.
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -C || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
  db-init:
    image: mcr.microsoft.com/mssql-tools
    container_name: finova-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - SA_PASSWORD=${SA_PASSWORD}
      - DB_NAME=${DB_NAME}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_NOMBRE=${ADMIN_NOMBRE}
    volumes:
      - ./docker/db-init:/init
      - ./database/scripts:/scripts
    # Se ejecuta el script de inicializacion directamente para evitar doble invocacion de bash.
    entrypoint: ["/bin/bash", "/init/entrypoint.sh"]
    restart: "no"
  api:
    # Servicio backend FINOVA en ASP.NET Core
    build:
      context: ./backend/FinovaApi
      dockerfile: Dockerfile
    container_name: finova-api #nombre del contenedor
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      # Sobrescribe la cadena de conexión local para usar el contenedor sqlserver.
      ConnectionStrings__FinovaDB: "Server=sqlserver,1433;Database=${DB_NAME};User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      # Sobrescribe JWT desde variables de entorno para portabilidad.
      JwtSettings__SecretKey: ${JWT_KEY}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
    ports:
      - "${API_PORT:-5000}:8080"
    restart: unless-stopped
  frontend:
    build:
      context: ./AdmonExamen
      dockerfile: Dockerfile
    container_name: finova-frontend
    depends_on:
      api:
        condition: service_started
    ports:
      # Correccion: variable de entorno correcta para puerto del frontend.
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  # Volumen nominal para datos persistentes de SQL Server.
  sql_data:
